output:
  base_dir: "./data"
  catalogs_dir: "./data/catalogs"
  spectra_dir: "./data/spectra"
  checkpoints_dir: "./data/checkpoints"

logging:
  level: "INFO"

network:
  retry_max_attempts: 5
  retry_base_delay_seconds: 2.0
  retry_max_delay_seconds: 120.0
  request_timeout_seconds: 300
  download_chunk_size: 65536

gaia:
  tap_url: "https://gea.esac.esa.int/tap-server"
  release: "dr3"
  db_schema: "gaiadr3"
  default_query_timeout: 600
  metadata_timeout_seconds: 30
  default_columns:
    - source_id
    - ra
    - dec
    - parallax
    - parallax_error
    - pmra
    - pmdec
    - phot_g_mean_mag
    - phot_bp_mean_mag
    - phot_rp_mean_mag
    - radial_velocity
    - ruwe

lamost:
  base_url: "http://www.lamost.org/dr11/v2.0"
  spectrum_base_url: "https://www.lamost.org/dr11/v2.0/spectrum/fits/"
  vizier_catalog_lrs: "V/162/dr11l"
  vizier_catalog_mrs: "V/162/dr11m"

sdss:
  skyserver_url: "https://skyserver.sdss.org/dr17"
  sas_base_url: "https://data.sdss.org/sas/dr17"
  data_release: 17
