<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Astro-Corpus · 从天文数据与文献到可追溯语料</title>
  <desc id="description">项目概念总览。选择 Gaia DR3 星表、VizieR 成员目录、可选 XP 光谱、SIMBAD 书目或显式 arXiv 论文列表，分别构建样本语料和论文全文语料，保存到具有 SQLite 索引、不可变文件和独立运行快照的共享本地库，再通过 CLI、Python、MCP 或本机只读查看器访问。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111f34"/>
      <stop offset="1" stop-color="#091321"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 110) rotate(90) scale(270 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#225e74" stop-opacity=".38"/>
      <stop offset="1" stop-color="#225e74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="1232" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79d9bc"/>
      <stop offset="1" stop-color="#91baff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="m1 1 4 3-4 3" stroke="#7592aa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 2.5px; }
      .heading { font-size: 24px; font-weight: 600; fill: #edf4ff; }
      .body { font-size: 20px; fill: #c2d0e0; }
      .muted { font-size: 18px; fill: #91a8be; }
    </style>
  </defs>

  <rect x=".5" y=".5" width="1279" height="599" rx="24" fill="url(#background)" stroke="#2b3d53"/>
  <rect x="1" y="1" width="1278" height="598" rx="24" fill="url(#glow)"/>
  <path d="M48 1h1184" stroke="url(#accent)" stroke-width="2"/>

  <!-- Decorative sky geometry; these marks do not represent a measured sample. -->
  <g stroke="#719eb7" stroke-opacity=".16">
    <ellipse cx="1086" cy="140" rx="122" ry="79" transform="rotate(-22 1086 140)"/>
    <ellipse cx="1086" cy="140" rx="166" ry="49" transform="rotate(-22 1086 140)"/>
    <path d="m896 192 76-78 83 28 82-70 75 48M972 114l50-58 115 16M1055 142l73 72 84-94"/>
  </g>
  <g fill="#d2e4f5">
    <circle cx="896" cy="192" r="2.3" opacity=".5"/>
    <circle cx="972" cy="114" r="3.5"/>
    <circle cx="1022" cy="56" r="2.2" opacity=".6"/>
    <circle cx="1055" cy="142" r="4"/>
    <circle cx="1137" cy="72" r="3" opacity=".8"/>
    <circle cx="1212" cy="120" r="3.2"/>
    <circle cx="1128" cy="214" r="2.4" opacity=".6"/>
    <circle cx="871" cy="65" r="1.4" opacity=".4"/>
    <circle cx="1187" cy="43" r="1.5" opacity=".5"/>
    <circle cx="1240" cy="224" r="1.5" opacity=".35"/>
    <circle cx="948" cy="231" r="1.4" opacity=".4"/>
  </g>
  <circle cx="1055" cy="142" r="11" stroke="#83d9c2" stroke-opacity=".65"/>
  <path d="M1055 122v-8m0 56v-8m20-20h8m-56 0h8" stroke="#83d9c2" stroke-opacity=".65"/>

  <text x="48" y="58" class="eyebrow" fill="#88d9c2">GAIA-FIRST · ASTRONOMICAL CORPUS</text>
  <text x="44" y="144" fill="#f3f7ff" font-size="68" font-weight="700" letter-spacing="-2">Astro-Corpus</text>
  <text x="48" y="197" fill="#d1deec" font-size="25">把星表、光谱与论文组织成可追溯的语料。</text>
  <text x="48" y="238" class="body" fill="#91a8be">按需获取 · 来源可查 · 版本固定 · 本地复用</text>

  <rect x="48" y="285" width="292" height="244" rx="16" fill="#132339" stroke="#30455e"/>
  <path d="M68 286h252" stroke="#78d7bb" stroke-width="2"/>
  <text x="70" y="321" class="eyebrow" fill="#8edbc3">01 / SELECT</text>
  <text x="70" y="359" class="heading">选择数据与文献</text>
  <text x="70" y="400" class="body" font-weight="600">Gaia DR3 · VizieR</text>
  <text x="70" y="431" class="muted">星表 / 成员目录 / 可选 XP</text>
  <text x="70" y="473" class="body" font-weight="600">SIMBAD · arXiv</text>
  <text x="70" y="504" class="muted">书目关联 / 显式论文全文</text>

  <path d="M348 407h27" stroke="#7592aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="388" y="285" width="340" height="244" rx="16" fill="#132339" stroke="#30455e"/>
  <path d="M408 286h300" stroke="#8ab7ff" stroke-width="2"/>
  <text x="410" y="321" class="eyebrow" fill="#9fc2ff">02 / BUILD</text>
  <text x="410" y="359" class="heading">构建可追溯语料</text>
  <rect x="410" y="382" width="296" height="44" rx="8" fill="#1b3841"/>
  <circle cx="430" cy="404" r="4" fill="#83dbc1"/>
  <text x="446" y="411" class="body">样本语料</text>
  <rect x="410" y="438" width="296" height="44" rx="8" fill="#26304b"/>
  <circle cx="430" cy="460" r="4" fill="#b9a7ed"/>
  <text x="446" y="467" class="body">论文全文语料</text>
  <text x="410" y="510" class="muted">两条独立路径，保留输入与来源</text>

  <path d="M736 407h27" stroke="#7592aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="776" y="285" width="456" height="244" rx="16" fill="#132339" stroke="#30455e"/>
  <path d="M796 286h416" stroke="#a89ade" stroke-width="2"/>
  <text x="798" y="321" class="eyebrow" fill="#c0b0ed">03 / REUSE</text>
  <text x="798" y="359" class="heading">共享本地库</text>
  <text x="798" y="402" class="body">SQLite 索引 + 不可变文件</text>
  <text x="798" y="438" class="body">每次运行保留独立快照</text>
  <path d="M798 460h412" stroke="#30455e"/>
  <text x="798" y="499" class="body">CLI / Python / MCP · 只读查看器</text>

  <text x="48" y="569" class="muted">DATA + LITERATURE + PROVENANCE</text>
  <text x="1232" y="569" class="muted" text-anchor="end">从选定样本出发，让每份语料有据可查。</text>
</svg>
